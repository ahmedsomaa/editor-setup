<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&family=Instrument+Serif&family=Fira+Code&display=swap"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--background);color:var(--foreground);font:400 16px/26px var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style><style>
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--radius-pill);border:1px solid transparent;font:500 14px/20px var(--font-sans);cursor:pointer;transition:background-color .15s,transform .15s}
.btn:active{transform:scale(.98)}.btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.default{background:var(--primary);color:var(--primary-foreground)}.default:hover{background:var(--primary-hover)}
.outline{background:var(--card);color:var(--foreground);border-color:var(--border)}.outline:hover{background:var(--muted)}
.secondary{background:var(--muted);color:var(--foreground);border-color:var(--border)}.ghost{background:transparent;color:var(--foreground)}.ghost:hover{background:var(--muted)}
.sm{height:36px;padding:0 12px}.lg{height:48px;padding:0 20px;font-size:16px}.btn[disabled]{opacity:.5;cursor:not-allowed}
</style></head><body><div class="row"><button class="btn default lg">Explore the Registry</button><button class="btn outline lg">+ Add a Pair</button></div>
<div class="row" style="margin-top:16px"><button class="btn default sm">Small</button><button class="btn default">Default</button><button class="btn outline">Copy</button><button class="btn secondary">Export HTML</button><button class="btn ghost">HTML</button><button class="btn default" disabled>Save PNG</button></div></body></html>
