<!-- @dsCard group="Actions" height=100 subtitle="Footer control: light, dark, system" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--background);color:var(--foreground);font:400 16px/26px var(--font-sans)}
.track{display:inline-flex;gap:4px;padding:4px;background:var(--muted);border:1px solid var(--border);border-radius:9999px}
button{width:32px;height:32px;border-radius:9999px;border:1px solid transparent;background:transparent;color:var(--muted-foreground);cursor:pointer;font-size:14px}
button[aria-pressed=true]{background:var(--card);color:var(--foreground);border-color:var(--border)}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}</style></head><body>
<div class="track" role="group" aria-label="Color theme"><button aria-pressed="true" aria-label="Light" title="Light">☀</button><button aria-pressed="false" aria-label="Dark" title="Dark">☾</button><button aria-pressed="false" aria-label="System" title="System">▭</button></div>
<script>document.querySelectorAll('.track button').forEach(b=>b.addEventListener('click',()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))}))</script></body></html>
