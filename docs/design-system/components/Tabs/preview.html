<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&family=Instrument+Serif&family=Fira+Code&display=swap"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--background);color:var(--foreground);font:400 16px/26px var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style><style>.track{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-pill)}
.track button{height:32px;min-width:84px;padding:0 14px;border:1px solid transparent;border-radius:var(--radius-pill);background:transparent;color:var(--muted-foreground);font:500 14px/20px var(--font-sans);cursor:pointer}
.track button[aria-pressed=true]{background:var(--card);color:var(--foreground);border-color:var(--border)}.track button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}</style></head><body>
<div class="track" role="group" aria-label="Editor"><button aria-pressed="true">VS Code</button><button aria-pressed="false">Cursor</button><button aria-pressed="false">Zed</button><button aria-pressed="false">Neovim</button></div>
<script>document.querySelectorAll('.track button').forEach(b=>b.addEventListener('click',()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))}))</script></body></html>
