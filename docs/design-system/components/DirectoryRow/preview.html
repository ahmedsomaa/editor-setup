<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&family=Instrument+Serif&family=Fira+Code&display=swap"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--background);color:var(--foreground);font:400 16px/26px var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style><style>ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--border);max-width:640px}li{border-bottom:1px solid var(--border)}
a{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:16px;padding:16px 12px;color:inherit;text-decoration:none;transition:background-color .15s}a:hover,a:focus-visible{background:var(--muted)}a:focus-visible{outline:2px solid var(--ring);outline-offset:-2px}
.aa{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}.n{font-weight:500}.f{font-size:14px;color:var(--muted-foreground)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:9999px;font:500 12px/16px var(--font-sans);letter-spacing:.05em;text-transform:uppercase;background:var(--muted);color:var(--muted-foreground);margin-left:6px}.green{background:var(--pastel-green);color:var(--pastel-green-text)}a:hover .tag:not(.green){background:var(--card)}</style></head><body>
<ul><li><a href="#"><span class="aa" style="background:var(--pair-palenight-bg);color:var(--pair-palenight-fg);font-family:'Fira Code',monospace">Aa</span><span><span class="n">Palenight Theme</span><br><span class="f" style="font-family:'Fira Code',monospace">Fira Code</span></span><span><span class="tag">Dark</span><span class="tag green">Open</span></span></a></li>
<li><a href="#"><span class="aa" style="background:var(--pair-gruvbox-bg);color:var(--pair-gruvbox-fg)">Aa</span><span><span class="n">Gruvbox Dark Hard</span><br><span class="f">JetBrains Mono</span></span><span><span class="tag">Dark</span><span class="tag green">Open</span></span></a></li>
<li><a href="#"><span class="aa" style="background:var(--pair-aura-bg);color:var(--pair-aura-fg)">Aa</span><span><span class="n">Aura Dark</span><br><span class="f">Geist Mono</span></span><span><span class="tag">Dark</span><span class="tag">Free</span></span></a></li></ul></body></html>
