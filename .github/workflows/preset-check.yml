name: Preset check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "presets/**"
      - "packages/preset-check/**"
      - "package.json"
      - "bun.lock"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check
