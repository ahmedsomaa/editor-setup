name: Registry check

on:
  pull_request:
    paths:
      - "registry/**"
      - "packages/registry-check/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "packages/registry-check/**"
      - "package.json"
      - "package-lock.json"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
