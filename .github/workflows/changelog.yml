name: Changelog

on:
  push:
    branches: [main]
    paths:
      - "registry/pairs/**"

concurrency:
  group: changelog
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Draft changelog entry
        run: node scripts/changelog-entry.mjs "${{ github.event.before }}" "${{ github.sha }}"
      - name: Open changelog PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- apps/web/src/routes/changelog.tsx; then
            echo "No changelog change."
            exit 0
          fi
          branch="chore/changelog-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add apps/web/src/routes/changelog.tsx
          git commit -m "docs(changelog): add entry for ${GITHUB_SHA::7}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs(changelog): add entry for ${GITHUB_SHA::7}" \
            --body "Draft changelog entry for Pair changes in ${GITHUB_SHA}. Edit the wording, then merge."
